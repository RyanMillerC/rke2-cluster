- name: Check whether RKE2 is already installed
  ansible.builtin.stat:
    path: /usr/bin/rke2
  register: rke2_binary

- name: Install RKE2 server from the RKE2 RPM repo
  ansible.builtin.shell: curl -sfL https://get.rke2.io | sh -
  args:
    executable: /bin/bash
  environment:
    INSTALL_RKE2_TYPE: server
    INSTALL_RKE2_METHOD: rpm
    INSTALL_RKE2_VERSION: "{{ rke2_version }}"
  when: not rke2_binary.stat.exists
