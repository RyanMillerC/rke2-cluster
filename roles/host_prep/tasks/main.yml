# Host Prep (RHEL) - see PLAN.md. Order matters: subscription must land
# before any dnf install, and RKE2 install is last since it's the handoff
# point to RKE2 Config (not this role's job).
- import_tasks: subscription.yml
- import_tasks: packages.yml
- import_tasks: selinux.yml
- import_tasks: swap.yml
- import_tasks: firewalld.yml
- import_tasks: network_manager.yml
- import_tasks: hosts_file.yml
- import_tasks: rke2_install.yml
