- name: Ensure RKE2 server manifests directory exists
  ansible.builtin.file:
    path: /var/lib/rancher/rke2/server/manifests
    state: directory
    mode: "0755"

- name: Write AWS KMS secret (Vault auto-unseal)
  ansible.builtin.template:
    src: vault-aws-kms-secret.yaml.j2
    dest: /var/lib/rancher/rke2/server/manifests/bootstrap-secret-vault-aws-kms.yaml
    mode: "0600"

- name: Write Synology CSI credential secret
  ansible.builtin.template:
    src: synology-csi-secret.yaml.j2
    dest: /var/lib/rancher/rke2/server/manifests/bootstrap-secret-synology-csi.yaml
    mode: "0600"

- name: Write cert-manager DNS token secret
  ansible.builtin.template:
    src: cert-manager-dns-secret.yaml.j2
    dest: /var/lib/rancher/rke2/server/manifests/bootstrap-secret-cert-manager-dns.yaml
    mode: "0600"
