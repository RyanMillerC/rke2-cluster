# Sandbox environment — shared across all 3 nodes.
# Values in <ANGLE_BRACKETS> are placeholders; fill in once the Network Plan
# in PLAN.md is finalized.

nic_name: eth0
domain: "<DOMAIN>"
node_netmask: "<LAB_NETMASK>"
node_gateway: "<LAB_GATEWAY>"
