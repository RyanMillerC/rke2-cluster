# Sandbox environment — shared across all 3 nodes.
# Values in <ANGLE_BRACKETS> are placeholders; fill in once the Network Plan
# in PLAN.md is finalized.

## Host

nic_name: eth0
domain: "taco.moe"
timezone: UTC

bootstrap_user: ryan
bootstrap_user_ssh_pubkey: "ssh-rsa  ryan@taco.moe"
ansible_user: "{{ bootstrap_user }}"
ansible_host: "{{ node_ip }}"

# Sandbox nodes get rebuilt from scratch on every sandbox-create, with a
# fresh host key each time. Host key checking is only useful for hardware
# that keeps the same key for its lifetime, so it's off here (left on for
# the Lab group once that exists).
ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

## Subscription (RHSM)

# Placeholders below are overridden by vault.yml - see the Bootstrap
# Secrets section for why (alphabetical group_vars merge order).
rhsm_username: REPLACED_BY_ANSIBLE_VAULT
rhsm_password: REPLACED_BY_ANSIBLE_VAULT

## RKE2

# Latest v1.36 release as of 2026-11-16 (PLAN.md pins the RKE2 Config
# decision to v1.36 or later) - check for newer v1.36.x patches before reuse.
rke2_version: "v1.36.6+rke2r1"

# Network Plan in PLAN.md.
api_vip: "192.168.0.98"
api_fqdn: "api.pico.taco.moe"

# Shared RKE2 cluster join secret - same value on all 3 nodes, set by Ryan
# directly in vault.yml (not generated by Ansible or Claude). Placeholder
# below is overridden by vault.yml - see the Bootstrap Secrets section for
# why (alphabetical group_vars merge order).
rke2_token: REPLACED_BY_ANSIBLE_VAULT

## kube-vip

# Latest stable release as of 2026-11-16, checked via `gh api
# repos/kube-vip/kube-vip/releases/latest` - check for newer before reuse.
kube_vip_version: "v1.3.1"

## Argo CD

# Build Sequence step 6 (Argo CD bootstrap) - PLAN.md "App delivery"
# decision. Separate repo from this one - rke2-cluster bootstraps the
# cluster, rke2-gitops is everything Argo syncs (platform config + apps).
# Chart version is the latest argo-helm release as of 2026-11-23, checked
# via `gh api repos/argoproj/argo-helm/releases` - check for newer before
# reuse.
argocd_version: "10.18.3"
argocd_git_repo_url: "https://github.com/RyanMillerC/rke2-gitops.git"
argocd_git_repo_revision: HEAD
argocd_git_repo_path: "bootstrap"

## Bootstrap Secrets

# PLAN.md "Bootstrap Secrets" - the 3 pre-Vault secrets templated by
# roles/bootstrap_secrets. No Ansible-vault-indicator prefix/indirection
# here (unlike rhsm_username/rke2_token below) - everything in vault.yml is
# a secret now, so that prefix added nothing. Each name is instead prefixed
# by the component that consumes it (vault_, synology_csi_, cert_manager_)
# - "vault_" here means the Vault app, not Ansible Vault.
#
# Placeholders below are overridden by the real values in vault.yml -
# "vault.yml" sorts after "vars.yml" alphabetically within
# group_vars/sandbox/, so Ansible's directory-merge gives it the last word
# for same-named vars. Don't rename either file without preserving that
# order. Namespaces are provisional for Synology/cert-manager - finalize
# against the real driver manifests when those waves are built in
# rke2-gitops.

# Vault (AWS KMS auto-unseal) - Ansible-forever, never hands off to ESO.
vault_namespace: vault
vault_aws_kms_access_key_id: REPLACED_BY_ANSIBLE_VAULT
vault_aws_kms_secret_access_key: REPLACED_BY_ANSIBLE_VAULT

# Synology CSI - genesis only, hands off to ESO once it exists.
synology_csi_namespace: kube-system
synology_csi_username: REPLACED_BY_ANSIBLE_VAULT
synology_csi_password: REPLACED_BY_ANSIBLE_VAULT

# cert-manager (Route53 creds for DNS-01, public taco.moe zone) - genesis
# only, hands off to ESO once it exists.
cert_manager_namespace: cert-manager
cert_manager_dns_aws_access_key_id: REPLACED_BY_ANSIBLE_VAULT
cert_manager_dns_aws_secret_access_key: REPLACED_BY_ANSIBLE_VAULT
