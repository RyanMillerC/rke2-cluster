# Fetch the admin kubeconfig from the first server and write it to
# KUBECONFIG at the repo root (gitignored), rewriting the server URL from
# the node's local loopback to the API VIP FQDN so it works from outside
# the cluster.
#
# Usage: ansible-playbook -i inventory/sandbox/hosts.yml playbooks/kubeconfig.yml --vault-password-file ~/.rke2-vault-pass

- name: Fetch and rewrite the admin kubeconfig
  hosts: rke2_first_server
  become: true
  gather_facts: false
  tasks:
    - name: Read the admin kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/rke2/rke2.yaml
      register: rke2_kubeconfig

    - name: Write KUBECONFIG locally, pointed at the API VIP FQDN
      ansible.builtin.copy:
        content: "{{ (rke2_kubeconfig.content | b64decode) | replace('https://127.0.0.1:6443', 'https://' + api_fqdn + ':6443') }}"
        dest: "{{ playbook_dir }}/../KUBECONFIG"
        mode: "0600"
      delegate_to: localhost
      become: false
