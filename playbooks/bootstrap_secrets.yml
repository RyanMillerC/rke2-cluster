# Pre-Vault Bootstrap Secrets (PLAN.md "Bootstrap Secrets"). Templates the
# AWS KMS, Synology CSI, and cert-manager DNS secrets as static manifests in
# RKE2's server manifests directory, the same mechanism roles/argocd uses to
# bootstrap Argo CD. Runs before argocd.yml so these Secrets exist before
# anything that needs them (storage, cert-manager, Vault waves) starts
# syncing. Idempotent - templating is safe to rerun.
#
# Usage: ansible-playbook -i inventory/sandbox/hosts.yml playbooks/bootstrap_secrets.yml --vault-password-file ~/.rke2-vault-pass

- name: Bootstrap pre-Vault secrets
  hosts: rke2_cluster
  become: true
  roles:
    - bootstrap_secrets
